# Flatpak deposu: yayınlanan sürümün .flatpak paketi, GitHub Pages'te (flatpak.hamaj.dev) imzalı bir OSTree deposuna
# çevrilir; Flatpak kullanıcıları böylece flatpak update ile güncellenir. Depo her sürümde sıfırdan kurulur: Flatpak
# yalnız değişen nesneleri indirdiği için güncellemeler yine küçük kalır, site de hep tek sürüm kadar yer tutar.
name: Flatpak

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # İmza anahtarının parmak izi; açık anahtarı flatpak/*.flatpakref ve .flatpakrepo dosyalarında.
  KEY_ID: 0508617915E2B48115678B7BB90885264D496A0F

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Araçları kur
        run: sudo apt-get update && sudo apt-get install -y flatpak ostree
      - name: Paketi indir
        env:
          GH_TOKEN: ${{ github.token }}
          # Elle çalıştırınca etiket yoktur; o zaman en son sürüm alınır.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG=${TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.flatpak' --dir bundle
          ls bundle
          if [ "$(ls bundle | wc -l)" -ne 1 ]; then
            echo "::error::Sürümde tam olarak bir .flatpak paketi olmalı"
            exit 1
          fi
      - name: İmza anahtarını yükle
        env:
          PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Depoyu kur
        run: |
          ostree init --mode=archive-z2 --repo=site
          flatpak build-import-bundle --gpg-sign="$KEY_ID" site bundle/*.flatpak
          flatpak build-update-repo --gpg-sign="$KEY_ID" --title="Skybox Launcher" --prune site
          rm -rf site/tmp
          cp flatpak/* site/
          # Launcher'ın açılışta okuduğu sürüm; depoyla aynı anda yayınlanır, böylece launcher depo yeni sürümü
          # sunmadan güncelleme istemez.
          printf '{"version":"%s"}\n' "$VERSION" > site/latest.json
          cat site/latest.json
          du -sh site
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: https://flatpak.hamaj.dev/
    steps:
      # deploy-pages, Pages'e commit'in SHA'sını sürüm diye verir; sürümler aynı main commit'inden yayınlandığı için
      # Pages yenisini eskisiyle aynı sanıp eskisini sunmaya devam ediyordu. Her çalışmaya kendi sürümü verilir.
      - uses: actions/github-script@v7
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        with:
          script: |
            const { owner, repo } = context.repo
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo,
              artifact_id: Number(process.env.ARTIFACT),
              pages_build_version: `${context.sha}-${context.runId}-${context.runAttempt}`,
              oidc_token: await core.getIDToken(),
            })
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id: deployment.id })
              core.info(data.status)
              if (data.status === 'succeed') {
                return
              }
              if (/fail|error|cancel|lost/.test(data.status)) {
                throw new Error(`Pages deployment ended with ${data.status}`)
              }
              await new Promise((resolve) => setTimeout(resolve, 5000))
            }
            throw new Error('Pages deployment did not finish in ten minutes')
